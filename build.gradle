plugins {
	alias(libs.plugins.spring.boot) apply false
	alias(libs.plugins.spring.dependency.management) apply false
}

group = 'com.xcelerate'
version = '0.0.1-SNAPSHOT'

def projectDescriptions = [
	'payment-validation-service': 'Validates payment requests before processing.',
	'payment-processing-service': 'Coordinates payment workflows and provider selection.',
	'stripe-provider-service': 'Integrates the platform with Stripe.',
	'paypal-provider-service': 'Integrates the platform with PayPal.'
]

subprojects {
	description = projectDescriptions[name]
	apply plugin: 'java'
	apply plugin: 'org.springframework.boot'
	apply plugin: 'io.spring.dependency-management'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	dependencies {
		implementation libs.spring.boot.starter.webmvc
		implementation libs.spring.boot.starter.validation
		implementation libs.spring.boot.starter.actuator
		compileOnly libs.lombok
		developmentOnly libs.spring.boot.devtools
		annotationProcessor libs.lombok
		testImplementation libs.spring.boot.starter.webmvc.test
		testCompileOnly libs.lombok
		testRuntimeOnly libs.junit.platform.launcher
		testAnnotationProcessor libs.lombok
	}

	tasks.withType(Test).configureEach {
		useJUnitPlatform()
	}
}
