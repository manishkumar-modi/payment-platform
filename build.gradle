/**
 * Payment Platform Build Configuration
 * 
 * This Gradle build file configures the Payment Platform application with:
 * - Java project setup and compilation
 * - Spring Boot framework integration (v4.1.1)
 * - Dependency management for Spring Boot projects
 * - Java 21 language level support
 * - Web MVC support with testing capabilities
 * 
 * Key Components:
 * - Spring Boot Starter WebMvc: Web application framework
 * - Lombok: Annotation processor for reducing boilerplate code
 * - Spring Boot DevTools: Development-time features and fast application restarts
 * - JUnit Platform: Testing framework
 */
 plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.xcelerate'
version = '0.0.1-SNAPSHOT'

// Java toolchain configuration
java {
	toolchain {
		// Target Java 21 language level for modern Java features and compatibility
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// Repository configuration
// Maven Central repository for dependency resolution
repositories {
	mavenCentral()
}

// Project dependencies
dependencies {
	// Spring Boot Web MVC Starter: Core web application framework with embedded Tomcat
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	
	// Lombok: Reduces boilerplate code through code generation annotations
	compileOnly 'org.projectlombok:lombok'
	
	// Spring Boot DevTools: Enables development-time features (auto-restart, live reload, configurations)
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	
	// Lombok Annotation Processor: Processes Lombok annotations during compilation
	annotationProcessor 'org.projectlombok:lombok'
	
	// Spring Boot Web MVC Test: Testing support for Spring web applications with MockMvc
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	
	// Lombok for test code compilation
	testCompileOnly 'org.projectlombok:lombok'
	
	// JUnit Platform Launcher: Required runtime dependency for JUnit 5 test execution and discovery
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	
	// Lombok Annotation Processor for test code
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// Configure JUnit 5 (Jupiter) test platform
tasks.named('test') {
	// Enable JUnit Platform for test execution and discovery
	useJUnitPlatform()
}
