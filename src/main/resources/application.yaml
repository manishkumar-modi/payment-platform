# ============================================
# Payment Platform Application Configuration
# ============================================
# This file contains the main configuration settings for the Payment Platform application.
# It defines Spring application properties including the application name and other
# framework-level configurations.
#
# Configuration hierarchy:
# - spring: Root Spring Framework configuration
#   - application: Application metadata and settings
#     - name: The logical name of the application used for identification

spring:
  application:
    # Application name identifier
    # This name is used by Spring Cloud services for service registration and identification
    name: payment-platform
